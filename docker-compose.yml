version: "3.9"

services:
  # ── PostgreSQL ──
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scanner
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── API Server ──
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://scanner:scanner@db:5432/scanner
      REDIS_URL: redis://redis:6379/0
      ENV_MODE: local
      DEBUG: "true"
      SESSION_STRICT_IP: "false"
    volumes:
      - ./scanner:/app/scanner
      - ./src:/app/src
      - ./static:/app/static
      - ./frontend:/app/frontend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn scanner.api:app --host 0.0.0.0 --port 8000 --reload

  # ── RQ Worker ──
  worker:
    build: .
    environment:
      DATABASE_URL: postgresql://scanner:scanner@db:5432/scanner
      REDIS_URL: redis://redis:6379/0
      ENV_MODE: local
      DEBUG: "true"
    volumes:
      - ./scanner:/app/scanner
      - ./src:/app/src
      - ./static:/app/static
      - ./frontend:/app/frontend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: rq worker scanner --url redis://redis:6379/0

volumes:
  pgdata:
